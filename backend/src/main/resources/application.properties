# ──────────────────────────────────────────────────────────────────
# BioYachay Backend - application.properties
# ──────────────────────────────────────────────────────────────────

# ─── Servidor ─────────────────────────────────────────────────────
server.port=8080

# ─── Base de datos MySQL ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bioyachay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── JWT ──────────────────────────────────────────────────────────
# IMPORTANTE: cambia este secret por uno propio en producción (mínimo 32 chars)
jwt.secret=bioyachay-super-secret-key-2024-secure!!
jwt.expiration=86400000
# 86400000 ms = 24 horas
